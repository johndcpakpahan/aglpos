 const rows=Object.entries(m).map(([c,e])=>{const hasP=Object.keys(e.g).some(k=>k!=='default'&&e.g[k]>0),pt=hasP?Object.entries(e.g).filter(([,n])=>n>0).map(([k,n])=>n+' '+(POT[k]||k)).join(', '):'',det=[pt?'Potongan: '+pt:'',e.note?'Catatan: '+e.note:''].filter(Boolean);
  return `<div style="margin-top:6px"><b style="font-size:17px">${e.n}× ${esc(c)}</b>${det.map(x=>`<p class="sub" style="margin:0">${esc(x)}</p>`).join('')}</div>`}).join('');
 return rows+(o.general_note?`<p class="sub" style="margin:6px 0 0">Catatan umum: ${esc(o.general_note)}</p>`:'')};

const vLogin=()=>`<div class="sc" style="${ctr}">${logo}<div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px"><h1 style="text-align:center">Masuk</h1>${S.err?`<div class="warn">${esc(S.err)}</div>`:''}<button class="btn" data-a="login">${ic('user')}Masuk dengan Google</button><p class="sub" style="text-align:center">Gunakan akun Google yang terdaftar di AGL POS</p></div></div>`;

function vAntrean(){
 const L=S.orders.filter(o=>o.status==='active'),A=L.filter(aktif),D=L.filter(o=>!aktif(o)).reverse(),X=S.tab==='aktif'?A:D;

 return `<div class="hd"><div><h1>Pesanan</h1><p class="sub">${A.length} pesanan aktif${S.ob.length?' · ⏳ '+S.ob.length+' menunggu sinkron':''}</p></div><button class="lnk" data-a="tutup">${ic('lock')}Tutup kasir</button></div><div class="bd sc"><div class="seg"><button class="${S.tab==='aktif'?'on':''}" data-a="tab" data-v="aktif">Aktif (${A.length})</button><button class="${S.tab==='selesai'?'on':''}" data-a="tab" data-v="selesai">Selesai</button></div>${X.map(card).join('')||'<p class="sub">Belum ada pesanan.</p>'}</div><div class="bot"><div style="display:flex;gap:8px"><button class="btn" data-a="baru" style="flex:1">${ic('plus')}Pesanan baru</button><button class="btn" data-a="riwayat" style="width:auto;padding:0 18px;background:#5B5F8D" aria-label="Riwayat pesanan">${ic('clock')}Riwayat</button></div><button class="lnk" data-a="logout" style="margin:6px auto 0;min-height:36px;font-size:14px">Keluar (${esc(S.email)})</button></div>`}

 if(!S.cash)return go('buka');
 if(S.cash.closed_at)return go('ditutup');
 await flush();await loadOrders();go('antrean')}
function add(c,d){const it=S.cart[c]||(S.cart[c]={g:{},note:''}),g=it.g;
 if(d>0)g.default=(g.default||0)+1;else if(g.default>0)g.default--;else{const k=Object.keys(g).find(x=>g[x]>0);if(k)g[k]--}
 if(q(c)===0)delete S.cart[c]}
async function tog(id,k){
 if(S.view==='riwayat'&&!canEdit())return;
 const o=fo(id),on=k==='done'?o.is_done:o.is_paid;
 const t=k==='done'?(on?'Kembalikan status proses?':'Tandai proses selesai?'):(on?'Kembalikan status bayar?':'Tandai sudah bayar?');
 if(!await ask(t,label(o),on?'Ya, kembalikan':'Ya, tandai'))return;
 const ops=[{u:uid(),t:'flag',id,f:k,v:!on,at:new Date().toISOString()}];
 if(k==='done'||o.business_date!==today())sq(o);push(...ops)}
async function simpan(){
 const f=S.f,cur=S.edit&&fo(S.edit);
 if(f.tipe==='online'&&!f.svc)return alert('Pilih layanan online dulu.');
 const past=!!cur&&cur.business_date!==today();if(past&&!canEdit())return alert('Hanya Owner yang bisa mengubah pesanan hari sebelumnya.');
 if(past&&!await ask('Simpan perubahan pesanan lama?',label(cur)+' · '+fmtD(cur.business_date)+'. Data tanggal itu di Google Sheet ikut diperbarui.','Ya, simpan'))return;
 const pr={};(cur?cur.order_items:[]).forEach(i=>pr[i.menu_code]=i.unit_price);
 const items=[];for(const c of Object.keys(S.cart)){const m=S.menu.find(x=>x.code===c)||{};for(const [p,n] of Object.entries(S.cart[c].g))if(n>0)items.push({menu_code:c,potongan:p,qty:n,unit_price:pr[c]!=null?pr[c]:m.price,note:S.cart[c].note.trim()||null})}
 const id=S.edit||crypto.randomUUID();
 const p={id,business_date:cur?cur.business_date:today(),order_type:f.tipe,online_service:f.tipe==='online'?f.svc:null,table_no:f.tipe==='dine_in'?(f.meja.trim()||null):null,customer_kind:f.untuk,staff_name:f.untuk==='staff'?(f.nama.trim()||null):null,general_note:f.umum.trim()||null,items};
 const rb=S.fromR;S.cart={};S.f=F0();S.edit=null;S.fromR=0;S.tab='aktif';S.view=rb?'riwayat':'antrean';
 S.ob.push({u:uid(),t:'save',p,at:new Date().toISOString(),hist:past?1:0});if(past)qd(p.business_date);else qs(id);saveOb();project();go(rb?'riwayat':'antrean');flush()}
async function editCash(field){
 const lab=field==='cash_start'?'Cash awal':'Cash akhir',old=S.cash[field];
 const v=await ask('Ubah '+lab,'Saat ini '+(old==null?'-':rp(old)),'Simpan',old==null?'':String(old),1);
 if(v===null)return;if(v==='')return alert('Isi jumlah cash dulu.');
 const n=+v;if(n===old)return;
 const r=await sb.from('cash_sessions').update({[field]:n}).eq('id',S.cash.id).select().single();if(r.error)return guard(r.error);
 S.cash=r.data;if(field==='cash_end')S.ce=String(n);
 await sb.from('cash_events').insert({session_id:S.cash.id,field,old_value:old,new_value:n,by_email:S.email});if(S.cash.closed_at){qd();saveOb();flush()}render()}
async function reopen(){
 if(!await ask('Buka kembali kasir?','Kasir hari ini dibuka lagi untuk pesanan dan perubahan.','Ya, buka kembali'))return;
 const r=await sb.from('cash_sessions').update({closed_at:null,closed_by:null}).eq('id',S.cash.id).select().single();if(r.error)return guard(r.error);
 S.cash=r.data;S.ce=r.data.cash_end==null?'':String(r.data.cash_end);
 await sb.from('cash_events').insert({session_id:S.cash.id,field:'buka_kembali',by_email:S.email});await loadOrders();go('antrean')}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const d=b.dataset,a=d.a;
 if(a==='login'){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error){S.err=error.message;render()}}
 else if(a==='logout')await sb.auth.signOut();
 else if(a==='mulai'){if(S.cs==='')return alert('Isi jumlah cash awal dulu.');S.busy=true;render();
  const r=await sb.from('cash_sessions').insert({business_date:today(),cash_start:+S.cs,opened_by:S.email}).select().single();
  if(r.error&&r.error.code==='23505')S.cash=(await sb.from('cash_sessions').select('*').eq('business_date',today()).single()).data;
  else if(r.error){S.busy=false;render();return guard(r.error)}else S.cash=r.data;
  S.busy=false;await loadOrders();go('antrean')}
 else if(a==='tab'){S.tab=d.v;render()}
 else if(a==='baru'||a==='menu')go('menu');
 else if(a==='kembali'){const rb=S.edit&&S.fromR;if(S.edit){S.edit=null;S.cart={};S.f=F0()}S.fromR=0;go(rb?'riwayat':'antrean')}
 else if(a==='lay'){S.lay=d.v;localStorage.setItem('lay',d.v);render()}
 else if(a==='cat'){S.cat=d.v;render()}
 else if(a==='add'){add(d.c,+d.d);render()}
 else if(a==='pot'){const g={},it=S.cart[d.c];for(const k in it.g)if(k!=='default'&&it.g[k]>0)g[k]=it.g[k];S.pot={c:d.c,g};render()}
 else if(a==='potd'){const g=S.pot.g,cur=g[d.k]||0,rem=q(S.pot.c)-Object.values(g).reduce((x,y)=>x+y,0),dd=+d.d;if((dd>0&&rem<=0)||(dd<0&&cur<=0))return;g[d.k]=cur+dd;render()}
 else if(a==='potsave'){const c=S.pot.c,g=S.pot.g,t=q(c),o=Object.values(g).reduce((x,y)=>x+y,0),n={};if(t-o>0)n.default=t-o;for(const k in g)if(g[k]>0)n[k]=g[k];S.cart[c].g=n;S.pot=null;render()}
 else if(a==='note'){S.cn={c:d.c,v:S.cart[d.c].note||''};render()}
 else if(a==='chip'){const t=NOTE_CHIPS[+d.i],l=S.cn.v.split(',').map(x=>x.trim()).filter(Boolean),k=l.indexOf(t);if(k>=0)l.splice(k,1);else l.push(t);S.cn.v=l.join(', ');render()}
 else if(a==='notesave'){S.cart[S.cn.c].note=S.cn.v.trim();S.cn=null;render()}
 else if(a==='notex'){S.cn=null;render()}
 else if(a==='lanjut')go('ringkas');
 else if(a==='tipe'||a==='untuk'){S.f[a]=d.v;render()}
 else if(a==='simpan')simpan();
 else if(a==='svc'){S.svcPick=true;render()}
 else if(a==='svcx'){S.svcPick=false;render()}
 else if(a==='svcset'){S.f.tipe='online';S.f.svc=d.v;S.svcPick=false;render()}
 else if(a==='belum')go('belum');
 else if(a==='edit'){const o=fo(d.id);if(!o)return;if(o.business_date!==today()&&!canEdit())return;S.edit=o.id;S.fromR=S.view==='riwayat'?1:0;S.cart={};
  o.order_items.forEach(i=>{const c=S.cart[i.menu_code]||(S.cart[i.menu_code]={g:{},note:''});c.g[i.potongan]=(c.g[i.potongan]||0)+i.qty;if(i.note&&!c.note)c.note=i.note});
  S.f={tipe:o.order_type,svc:o.online_service||'',meja:o.table_no||'',untuk:o.customer_kind,nama:o.staff_name||'',umum:o.general_note||''};go('menu')}
 else if(a==='cancel'){const o=fo(d.id);if(!o)return;if(o.business_date!==today()&&!canEdit())return;
  const r=await ask('Batalkan pesanan?',label(o)+(o.business_date!==today()?' · '+fmtD(o.business_date):'')+'. Pesanan tidak dihitung lagi. Alasan (opsional):','Ya, batalkan','');if(r===null)return;
  S.ob.push({u:uid(),t:'cancel',id:o.id,reason:String(r).trim()});sq(o);saveOb();project();render();flush()}
 else if(a==='tog')tog(d.id,d.k);
 else if(a==='riwayat'){go('riwayat');setRd(today())}
 else if(a==='rgeser')setRd(addDays(S.rd,+d.v));
 else if(a==='rsync'){qd(S.rd);saveOb();render();flush()}
 else if(a==='tutup')go('tutup');
 else if(a==='edawal')editCash('cash_start');else if(a==='edakhir')editCash('cash_end');else if(a==='reopen')reopen();
 else if(a==='tutupgo'){
  if(!await ask('Tutup kasir hari ini?','Cash awal '+rp(S.cash.cash_start)+', cash akhir '+rp(S.ce),'Ya, tutup'))return;
  S.busy=true;render();const r=await sb.from('cash_sessions').update({cash_end:+S.ce,closed_by:S.email,closed_at:new Date().toISOString()}).eq('id',S.cash.id).select().single();
  S.busy=false;if(r.error){render();return guard(r.error)}S.cash=r.data;qd();saveOb();go('ditutup');flush()}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(t.id==='mi'&&d.num){const v=t.value.replace(/\D/g,'').slice(0,9);t.value=v?rp(v):''}else if(d.cash){const v=t.value.replace(/\D/g,'').slice(0,9);S[d.cash]=v;t.value=v?rp(v):''}else if(d.f)S.f[d.f]=t.value;else if(d.n)S.cart[d.n].note=t.value;else if(d.cn)S.cn.v=t.value;else if(d.rd)setRd(t.value)});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.cash=null;S.orders=[];S.role='';S.ro=[];S.rsrv=[];LS('agl_role',null);S.cart={};go('login')}});
setInterval(async()=>{if(S.view==='antrean'&&!document.hidden&&!S.modal){await flush();if(!S.flushing){await loadOrders();render()}}},8000);
window.addEventListener('online',()=>flush());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
boot();
</script></body></html>
